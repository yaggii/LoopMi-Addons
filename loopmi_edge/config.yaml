name: LoopMi Edge
version: "0.51.52"
slug: loopmi_edge
description: Production-grade LoopMi Edge runtime for Home Assistant Add-on.
url: https://github.com/yaggii/LoopMi-Addons
image: ghcr.io/yaggii/loopmi-edge
startup: application
boot: auto
init: false
homeassistant_api: true
hassio_api: true
arch:
  - aarch64
watchdog: http://[HOST]:5034/health
ports:
  5034/tcp: 5034
ports_description:
  5034/tcp: LoopMi Edge REST API
map:
  - addon_config:rw
options:
  registration_token: ""
  cloud_base_url: ""
  ingestion_base_url: ""
  clear_connection: false
schema:
  registration_token: "password?"
  cloud_base_url: "url?"
  ingestion_base_url: "url?"
  clear_connection: "bool?"
